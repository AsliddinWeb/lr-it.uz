services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: edtech
      POSTGRES_DB: edtech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edtech-network

  redis:
    image: redis:7-alpine
    networks:
      - edtech-network

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    volumes:
      - piston_data:/piston
    networks:
      - edtech-network

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    networks:
      - edtech-network

  frontend:
    build: ./frontend
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - edtech-network

  bot:
    build: ./bot
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - edtech-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "8700:80"
    networks:
      - edtech-network

networks:
  edtech-network:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
  piston_data:
