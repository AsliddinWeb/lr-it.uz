# Serverdagi (host) nginx uchun: /etc/nginx/sites-available/lr-it.conf
# Domenlarni Docker'dagi nginx'ga (127.0.0.1:8700) uzatadi. SSL'ni certbot qo'shadi.

server {
    listen 80;
    listen [::]:80;
    server_name lr-it.uz www.lr-it.uz lr-it.neonsoft.uz;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (kod ijrosi, AI chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# /etc/nginx/nginx.conf dagi http { } ichida (yoki conf.d/ faylida) quyidagi map bo'lishi kerak.
