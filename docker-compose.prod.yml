# Production: docker compose -f docker-compose.prod.yml up -d --build
# Faqat 127.0.0.1:8700 ochiladi — tashqaridan domen orqali serverdagi nginx (SSL bilan) uzatadi.
#
# Server (2 GB RAM) boshqa loyihalar bilan bo'lishilgani uchun har bir xizmatga xotira limiti qo'yilgan:
# xotira yetmasa, Linux qo'shni loyihalarni emas, shu stack'ning o'z konteynerini to'xtatadi.
name: lrit

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: edtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida kerak}
      POSTGRES_DB: edtech
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech -d edtech"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edtech-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - edtech-network

  minio:
    image: minio/minio
    restart: unless-stopped
    mem_limit: 256m
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY .env faylida kerak}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY .env faylida kerak}
    volumes:
      - minio_data:/data
    networks:
      - edtech-network

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    mem_limit: 384m
    privileged: true
    volumes:
      - piston_data:/piston
    networks:
      - edtech-network

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env
    # Migratsiyalar har ishga tushganda qo'llanadi (yangi bo'lmasa — hech narsa qilmaydi).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
             --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - edtech-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # middleware.ts tokenni tekshirish uchun JWT_SECRET'ni build vaqtida ham ishlatadi
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env faylida kerak}
    restart: unless-stopped
    mem_limit: 384m
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - edtech-network

  bot:
    build: ./bot
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - edtech-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8700:80"
    networks:
      - edtech-network

networks:
  edtech-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  piston_data:
